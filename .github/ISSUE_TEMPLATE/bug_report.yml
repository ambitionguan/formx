name: Bug report
description: Report a reproducible FormX problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide a minimal schema, code sample, or repository.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "@formx/core@0.1.0"
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Node 22, Vue 3.5, Element Plus 2.13"
